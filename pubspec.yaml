name: getx_architecture
description: "Production-ready Flutter + GetX starter architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management, DI and routing
  get: ^4.7.3

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # Storage
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.0.0

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Bundled fonts (optional). `google_fonts` fetches Inter at runtime by
  # default; drop the .ttf files in assets/fonts/ and uncomment this block to
  # ship them instead — see lib/theme/app_typography.dart.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
